name: Brand Centre sync

# Keeps the Brand System library in the Brand Centre and this repository in step, with no computer involved.
#   - Library to GitHub: at noon and midnight UK time (and on demand), edits made in the library become the one
#     "Brand Centre edits" draft pull request.
#   - GitHub to library: after every push to main, the changed files go to the library. Library edits are
#     brought into the pull request first, so a merge never overwrites an edit nobody has seen.
# internal/ lives in another library, which this workflow's app registration cannot reach.
# Setup (app registration, variables, secret): tools/brand_centre/README.md. Until BRAND_CENTRE_CLIENT_ID is
# set, every job skips.

on:
  push:
    branches: [main]
  schedule:
    # GitHub runs schedules in UTC: both pairs, so one of them is noon and midnight in London all year.
    - cron: "0 0,12 * * *"
    - cron: "0 11,23 * * *"
  repository_dispatch:
    # A Power Automate flow on the library can send this to sync at once (optional).
    types: [brand-centre-changed]
  workflow_dispatch:
    inputs:
      mode:
        description: "pull: library edits to a pull request. push: main to the library. restore: main back over unmerged library edits. status: list library edits."
        type: choice
        options: [pull, push, restore, status]
        default: pull

permissions: {}

concurrency:
  group: brand-centre-sync
  cancel-in-progress: false

env:
  RCLONE_VERSION: v1.75.2
  RCLONE_ONEDRIVE_CLIENT_CREDENTIALS: "true"
  RCLONE_ONEDRIVE_DRIVE_TYPE: documentLibrary
  RCLONE_ONEDRIVE_TENANT: ${{ vars.BRAND_CENTRE_TENANT_ID }}
  RCLONE_ONEDRIVE_CLIENT_ID: ${{ vars.BRAND_CENTRE_CLIENT_ID }}
  RCLONE_ONEDRIVE_DRIVE_ID: ${{ vars.BRAND_CENTRE_DRIVE_ID }}

jobs:
  sync:
    if: vars.BRAND_CENTRE_CLIENT_ID != '' && (github.event_name != 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Decide what this run does
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$EVENT" in
            push) mode=push ;;
            workflow_dispatch) mode="$INPUT_MODE" ;;
            *) mode=pull ;;
          esac
          # Of the two schedules, only the one that is noon and midnight in London today runs: the UTC one in
          # winter, the hour-earlier one while the clocks are forward.
          if [ "$EVENT" = schedule ]; then
            if [ "$(TZ=Europe/London date +%z)" = "+0000" ]; then want="0 0,12 * * *"; else want="0 11,23 * * *"; fi
            [ "$SCHEDULE" = "$want" ] || mode=skip
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Mode: $mode"

      - name: Mint the bot token
        id: app
        if: steps.plan.outputs.mode != 'skip' && steps.plan.outputs.mode != 'status'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0 # zizmor: ignore[github-app]
        with:
          client-id: ${{ vars.RESNOVAS_BOT_APP_ID }}
          private-key: ${{ secrets.RESNOVAS_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.plan.outputs.mode != 'skip'
        with:
          ref: ${{ github.event.repository.default_branch }}
          # push compares main with the commit the library last matched.
          fetch-depth: 0
          persist-credentials: false

      - name: Install rclone
        if: steps.plan.outputs.mode != 'skip'
        run: |
          cd "$RUNNER_TEMP"
          base="https://downloads.rclone.org/$RCLONE_VERSION"
          zip="rclone-$RCLONE_VERSION-linux-amd64.zip"
          curl -fsSLO "$base/$zip"
          curl -fsSLO "$base/SHA256SUMS"
          grep " $zip\$" SHA256SUMS | sha256sum -c -
          unzip -q "$zip"
          mkdir -p bin && mv "rclone-$RCLONE_VERSION-linux-amd64/rclone" bin/
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Bot identity
        id: bot
        if: steps.plan.outputs.mode == 'pull' || steps.plan.outputs.mode == 'push'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id="$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)"
          echo "name=${SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${id}+${SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      # Every run that writes starts by bringing library edits into the pull request.
      - name: Library edits to the pull request
        if: steps.plan.outputs.mode == 'pull' || steps.plan.outputs.mode == 'push'
        env:
          RCLONE_ONEDRIVE_CLIENT_SECRET: ${{ secrets.BRAND_CENTRE_CLIENT_SECRET }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT_NAME: ${{ steps.bot.outputs.name }}
          BOT_EMAIL: ${{ steps.bot.outputs.email }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 tools/brand_centre/sync.py pull
          sh tools/brand_centre/edits_pr.sh
          git checkout --quiet "$DEFAULT_BRANCH"
          git reset --quiet --hard "origin/$DEFAULT_BRANCH"
          git clean -fdq

      - name: Main to the library
        if: steps.plan.outputs.mode == 'push' || steps.plan.outputs.mode == 'restore'
        env:
          RCLONE_ONEDRIVE_CLIENT_SECRET: ${{ secrets.BRAND_CENTRE_CLIENT_SECRET }}
          MODE: ${{ steps.plan.outputs.mode }}
        run: python3 tools/brand_centre/sync.py "$MODE"

      - name: List library edits
        if: steps.plan.outputs.mode == 'status'
        env:
          RCLONE_ONEDRIVE_CLIENT_SECRET: ${{ secrets.BRAND_CENTRE_CLIENT_SECRET }}
        run: python3 tools/brand_centre/sync.py status
