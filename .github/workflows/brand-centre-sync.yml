name: Brand Centre sync

# Brings edits made in the Brand System library in the Brand Centre into this repository, with no computer
# involved. The library is the source of truth (Jonathan, 2026-10-25), so the sync only pulls:
#   - At noon and midnight UK time (and on demand), edits made in the library are committed straight to main by
#     the bot app (Jonathan, 2026-10-25: no pull request to manage).
#   - Nothing from main is written to the library, except a `seed` run started by hand for a new or emptied
#     library.
# The library's internal folder (team-only material and internal tools) is never read or written here.
# Setup (app registration, variables, secret): tools/brand_centre/README.md. Until BRAND_CENTRE_CLIENT_ID is
# set, every job skips.

on:
  schedule:
    # GitHub runs schedules in UTC: both pairs, so one of them is noon and midnight in London all year.
    - cron: "0 0,12 * * *"
    - cron: "0 11,23 * * *"
  repository_dispatch:
    # A Power Automate flow on the library can send this to sync at once (optional).
    types: [brand-centre-changed]
  workflow_dispatch:
    inputs:
      mode:
        description: "pull: library edits to main. status: list library edits. seed: copy the files the library lacks from main, never replacing one."
        type: choice
        options: [pull, status, seed]
        default: pull

permissions: {}

concurrency:
  group: brand-centre-sync
  cancel-in-progress: false

env:
  # Not RCLONE_VERSION: rclone reads every RCLONE_<FLAG> variable as a flag, and that one is --version.
  RCLONE_RELEASE: v1.75.2
  RCLONE_ONEDRIVE_CLIENT_CREDENTIALS: "true"
  RCLONE_ONEDRIVE_DRIVE_TYPE: documentLibrary
  RCLONE_ONEDRIVE_TENANT: ${{ vars.BRAND_CENTRE_TENANT_ID }}
  RCLONE_ONEDRIVE_CLIENT_ID: ${{ vars.BRAND_CENTRE_CLIENT_ID }}
  RCLONE_ONEDRIVE_DRIVE_ID: ${{ vars.BRAND_CENTRE_DRIVE_ID }}

jobs:
  sync:
    if: vars.BRAND_CENTRE_CLIENT_ID != '' && (github.event_name != 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Decide what this run does
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$EVENT" in
            workflow_dispatch) mode="$INPUT_MODE" ;;
            *) mode=pull ;;
          esac
          # Of the two schedules, only the one that is noon and midnight in London today runs: the UTC one in
          # winter, the hour-earlier one while the clocks are forward.
          if [ "$EVENT" = schedule ]; then
            if [ "$(TZ=Europe/London date +%z)" = "+0000" ]; then want="0 0,12 * * *"; else want="0 11,23 * * *"; fi
            [ "$SCHEDULE" = "$want" ] || mode=skip
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Mode: $mode"

      - name: Mint the bot token
        id: app
        if: steps.plan.outputs.mode != 'skip' && steps.plan.outputs.mode != 'status'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0 # zizmor: ignore[github-app]
        with:
          client-id: ${{ vars.RESNOVAS_BOT_APP_ID }}
          private-key: ${{ secrets.RESNOVAS_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.plan.outputs.mode != 'skip'
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install rclone
        if: steps.plan.outputs.mode != 'skip'
        run: |
          cd "$RUNNER_TEMP"
          base="https://downloads.rclone.org/$RCLONE_RELEASE"
          zip="rclone-$RCLONE_RELEASE-linux-amd64.zip"
          curl -fsSLO "$base/$zip"
          curl -fsSLO "$base/SHA256SUMS"
          grep " $zip\$" SHA256SUMS | sha256sum -c -
          unzip -q "$zip"
          mkdir -p bin && mv "rclone-$RCLONE_RELEASE-linux-amd64/rclone" bin/
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Bot identity
        id: bot
        if: steps.plan.outputs.mode == 'pull' || steps.plan.outputs.mode == 'seed'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id="$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)"
          echo "name=${SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${id}+${SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      # Every run that writes starts by committing library edits to main; a seed never replaces an edit.
      - name: Library edits to main
        if: steps.plan.outputs.mode == 'pull' || steps.plan.outputs.mode == 'seed'
        env:
          RCLONE_ONEDRIVE_CLIENT_SECRET: ${{ secrets.BRAND_CENTRE_CLIENT_SECRET }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT_NAME: ${{ steps.bot.outputs.name }}
          BOT_EMAIL: ${{ steps.bot.outputs.email }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 tools/brand_centre/sync.py pull
          sh tools/brand_centre/edits_commit.sh
          git fetch --quiet origin "$DEFAULT_BRANCH"
          git reset --quiet --hard "origin/$DEFAULT_BRANCH"
          git clean -fdq

      - name: Seed the library from main
        if: steps.plan.outputs.mode == 'seed'
        env:
          RCLONE_ONEDRIVE_CLIENT_SECRET: ${{ secrets.BRAND_CENTRE_CLIENT_SECRET }}
        run: python3 tools/brand_centre/sync.py seed

      - name: List library edits
        if: steps.plan.outputs.mode == 'status'
        env:
          RCLONE_ONEDRIVE_CLIENT_SECRET: ${{ secrets.BRAND_CENTRE_CLIENT_SECRET }}
        run: python3 tools/brand_centre/sync.py status
